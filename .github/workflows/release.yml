# Builds Jet's Wallboard on Windows and attaches it to a GitHub release:
#   JetsWallboardSetup.exe      - installer (Start menu, desktop, start with Windows, uninstaller)
#   JetsWallboard.exe           - the app itself (also what the in-app update button downloads)
#   JetsWallboard-Windows.zip   - portable version, no install
#
# To ship a new version: Releases > "Draft a new release" > new tag like v1.1.0 > Publish.
name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build JetsWallboard.exe
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=$env:TAG" -o JetsWallboard.exe .
          Get-Item JetsWallboard.exe | Format-List Name, Length

      - name: Make the portable zip
        run: |
          New-Item -ItemType Directory -Force dist\JetsWallboard | Out-Null
          Copy-Item JetsWallboard.exe, package\* dist\JetsWallboard\
          Compress-Archive -Path dist\JetsWallboard -DestinationPath JetsWallboard-Windows.zip -Force

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = $env:TAG.TrimStart('v')
          & $iscc "/DMyAppVersion=$ver" "/DSourceExe=$PWD\JetsWallboard.exe" installer\JetsWallboard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\JetsWallboardSetup.exe .

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" JetsWallboardSetup.exe JetsWallboard.exe JetsWallboard-Windows.zip --clobber
