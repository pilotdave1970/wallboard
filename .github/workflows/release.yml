# Builds JetsWallboard.exe and attaches it to a GitHub release.
#
# To ship a new version: Releases > "Draft a new release" > new tag like v1.0.1 > Publish.
# About a minute later the .exe and the .zip appear on the release, and every copy of the
# board finds it under Settings > Board > Check for updates.
name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build JetsWallboard.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=${TAG}" -o JetsWallboard.exe .
          file JetsWallboard.exe

      - name: Make the download zip
        run: |
          mkdir -p dist/JetsWallboard
          cp JetsWallboard.exe package/* dist/JetsWallboard/
          (cd dist && zip -r ../JetsWallboard-Windows.zip JetsWallboard)

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" JetsWallboard.exe JetsWallboard-Windows.zip --clobber
